; SeismoM5 Notifier: M5StickC Plus that beeps on sensor alerts (ESP-NOW)
; and on USGS-reported earthquakes in the configured region.
[env:m5stick-c-plus]
platform = espressif32@6.10.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_flags = -I../src
lib_deps =
	m5stack/M5StickCPlus@0.1.1
	bblanchon/ArduinoJson@^6.19.4

; Wireless updates once the OTA firmware is on the stick: pio run -e ota -t upload
[env:ota]
extends = env:m5stick-c-plus
upload_protocol = espota
upload_port = seismoNotifier.local
